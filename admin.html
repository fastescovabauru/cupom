<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Escova Bauru · Validar cupom</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#f7f5f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#151515;border:1px solid rgba(212,175,55,0.25);border-radius:18px;padding:26px 22px}
  h1{font-size:19px;margin-bottom:4px}
  .sub{color:#a8a49b;font-size:13px;margin-bottom:20px}
  label{display:block;font-size:11px;font-weight:700;color:#e8cc6a;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;margin-top:14px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.12);background:#1e1e1e;color:#f7f5f0;font-size:16px}
  input:focus{outline:none;border-color:#d4af37}
  button{width:100%;margin-top:18px;padding:14px;border-radius:11px;border:none;background:linear-gradient(180deg,#e8cc6a,#d4af37);color:#161200;font-weight:800;font-size:15px}
  button:disabled{opacity:0.6}
  .resultado{margin-top:18px;padding:14px;border-radius:12px;font-size:13.5px;line-height:1.6;display:none}
  .resultado.show{display:block}
  .r-valido{background:rgba(60,180,100,0.12);border:1px solid rgba(60,180,100,0.4);color:#a8e8bc}
  .r-usado{background:rgba(180,80,60,0.12);border:1px solid rgba(180,80,60,0.4);color:#e8a48c}
  .r-expirado{background:rgba(150,150,150,0.12);border:1px solid rgba(150,150,150,0.4);color:#ccc}
  .r-erro{background:rgba(180,80,60,0.12);border:1px solid rgba(180,80,60,0.4);color:#e8a48c}
  .dados{margin-top:10px;font-size:12.5px;color:#a8a49b}
  .dados b{color:#f7f5f0}
  .btn-usar{margin-top:12px;background:#1e1e1e;border:1.5px solid rgba(212,175,55,0.4);color:#f7f5f0}
</style>
</head>
<body>
<div class="card">
  <h1>Validar cupom · Fast Escova Bauru</h1>
  <div class="sub">Uso interno da equipe — confere e dá baixa no cupom quando a cliente usar.</div>

  <label>Senha da loja</label>
  <input id="senha" type="password" placeholder="Senha do painel" autocomplete="off">

  <label>Código do cupom</label>
  <input id="codigo" placeholder="FASTBAURUxxxx" autocapitalize="characters">

  <button id="btnConsultar">Consultar</button>

  <div class="resultado" id="resultado"></div>
</div>

<script>
/* Cole aqui a mesma URL do Apps Script usada em index.html */
const SHEETS_URL = "COLE_AQUI_A_URL_DO_APPS_SCRIPT_/exec";

const $ = id => document.getElementById(id);
let cupomAtual = null;

$('btnConsultar').addEventListener('click', consultar);
$('codigo').addEventListener('keydown', e => { if (e.key === 'Enter') consultar(); });

async function consultar(){
  const senha = $('senha').value.trim();
  const codigo = $('codigo').value.trim().toUpperCase();
  if (!senha || !codigo) return;

  if (!SHEETS_URL || SHEETS_URL.indexOf('COLE_AQUI') > -1) {
    alert('Configuração pendente: cole a URL do Apps Script na constante SHEETS_URL do admin.html.');
    return;
  }

  const btn = $('btnConsultar');
  btn.disabled = true; btn.textContent = 'Consultando…';

  try {
    const r = await fetch(SHEETS_URL + '?action=listar_admin&senha=' + encodeURIComponent(senha) + '&t=' + Date.now());
    const data = await r.json();
    if (data.erro) { mostrarErro(data.erro); return; }

    const registro = (data.registros || []).find(x => String(x.codigo_cupom).toUpperCase() === codigo);
    if (!registro) { mostrarErro('Cupom não encontrado.'); return; }

    cupomAtual = registro;
    mostrarResultado(registro, senha);
  } catch (err) {
    mostrarErro('Falha ao consultar. Confere sua internet e tenta de novo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Consultar';
  }
}

function mostrarErro(msg){
  const el = $('resultado');
  el.className = 'resultado show r-erro';
  el.innerHTML = msg;
}

function mostrarResultado(registro, senha){
  const el = $('resultado');
  const compareceu = String(registro.compareceu || '').toLowerCase() === 'sim';

  let classe = 'r-valido';
  let statusTxt = '✅ Válido — pode usar';
  if (compareceu) { classe = 'r-usado'; statusTxt = '⛔ Já foi usado em ' + (registro.compareceu_em || ''); }

  el.className = 'resultado show ' + classe;
  el.innerHTML = `
    <div><b>${statusTxt}</b></div>
    <div class="dados">
      <div><b>Nome:</b> ${registro.nome}</div>
      <div><b>Telefone:</b> ${registro.telefone}</div>
      <div><b>Cadastrado em:</b> ${registro.data_cadastro}</div>
      <div><b>Válido até:</b> ${registro.data_validade}</div>
    </div>
  `;

  if (!compareceu) {
    const btnUsar = document.createElement('button');
    btnUsar.className = 'btn-usar';
    btnUsar.textContent = 'Marcar como usado agora';
    btnUsar.onclick = () => marcarUsado(registro.codigo_cupom, senha);
    el.appendChild(btnUsar);
  }
}

async function marcarUsado(codigo, senha){
  try {
    await fetch(SHEETS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'marcar_compareceu', codigo_cupom: codigo, senha })
    });
    consultar();
  } catch (err) {
    mostrarErro('Falha ao marcar como usado. Tenta de novo.');
  }
}
</script>
</body>
</html>
